# The Bazel Central Registry's checks of a release of autoload_sentry: bcr/smoke, a consumer
# of the module's add-ons that registers the prebuilt engine
# (registry-test-module-in-bcr).
bcr_test_module:
  module_path: "bcr/smoke"
  matrix:
    platform: ["macos", "macos_arm64", "ubuntu2204"]
    bazel: ["9.*"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
