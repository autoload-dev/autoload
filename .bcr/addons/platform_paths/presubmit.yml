# The Bazel Central Registry's checks of a release of autoload_platform_paths.
matrix:
  platform: ["macos", "macos_arm64", "ubuntu2204"]
  bazel: ["9.*"]
tasks:
  verify_targets:
    name: Build the add-ons
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
      - "@autoload_platform_paths//..."
