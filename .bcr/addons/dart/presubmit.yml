# The Bazel Central Registry's checks of a release of autoload_dart: bcr/smoke, a consumer
# that packs the module's add-ons with the prebuilt engine (RG020).
bcr_test_module:
  module_path: "bcr/smoke"
  matrix:
    platform: ["macos", "macos_arm64", "ubuntu2204"]
    bazel: ["9.*"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
