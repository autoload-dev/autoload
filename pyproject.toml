[tool.ruff]
target-version = "py314"
line-length = 90
force-exclude = true
# First-party code: the tools packages of the root module and of the ruleset.
src = [".", "rules_godot"]

[tool.ruff.lint]
# Ruff's default rules plus required annotations.
extend-select = ["ANN"]
ignore = ["ANN401"]

[tool.ty.environment]
# Bazel runs these tools with the registered Python toolchain.
python-version = "3.14"
# The ruleset's tools package, and the launcher, which imports its sibling modules as the
# host's python3 runs it.
extra-paths = ["rules_godot", "rules_godot/tools/platforms/launch"]

[tool.ty.analysis]
# Available only inside Bazel runfiles or Godot's SCons environment.
allowed-unresolved-imports = [
  "google.protobuf.**",
  "stardoc.**",
  "SCons.**",
  "methods",
]

[tool.ty.src]
