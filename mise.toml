# The repository's tools and environment, and the everyday tasks. The lanes' work lives in
# tools/ci/work.py; `mise run ci:lane -- <lane>` runs one. Policy: docs/internal/verification.md.
min_version = "2026.10.15"

# mise.lock pins each tool's download URL and checksum per platform, and mise
# installs only what it lists. After changing [tools], run
# `mise lock --platform macos-arm64,linux-x64,linux-arm64`.
[settings]
lockfile = true

# Python comes from Astral's CDN, which serves the same files as the GitHub releases that
# mise.lock records, so the lock's checksums still apply.
[settings.url_replacements]
"https://github.com/astral-sh/python-build-standalone/releases/download/" = "https://releases.astral.sh/github/python-build-standalone/releases/download/"

[tool_config]
locked = true

[vars]
java_version = "temurin-21.0.13+9.0.LTS"
android_api_levels = "35,36"
android_build_tools = "35.0.0"
android_ndk_version = "29.0.14206865"

[tools]
bazelisk = "1.29.0"
hk = { version = "2.5.0", lazy = true }
# The workflow checks of the quality lane (tools/ci/work.py).
jactionlint = { version = "2.4.0", lazy = true }
node = { version = "24.22.2", lazy = true }
java = { version = "{{ vars.java_version }}", lazy = true }
python = "3.14.6"

[wrappers]
bazel = "bazelisk"

# Fallback only: bootstrap first reuses an installed SDK and sdkmanager.
[tools."http:android-commandlinetools"]
version = "15859902"
lazy = true
lazy_bins = ["sdkmanager"]
strip_components = 1
bin_path = "bin"

[tools."http:android-commandlinetools".platforms]
macos-arm64 = { url = "https://dl.google.com/android/repository/commandlinetools-mac_arm64-{{ version }}_latest.zip" }
linux-x64 = { url = "https://dl.google.com/android/repository/commandlinetools-linux-{{ version }}_latest.zip" }
linux-arm64 = { url = "https://dl.google.com/android/repository/commandlinetools-linux-{{ version }}_latest.zip" }

# CodeScene's CLI, which tools/code_health scores files with. Its archives are named after the
# build of a version, which https://devtools.codescene.io/api/cli/cs?version=<version> returns
# as `sha`.
[tools."http:cs"]
version = "1.0.58"
lazy = true
lazy_bins = ["cs"]
# The archive's binary is not marked executable.
postinstall = 'chmod +x "$MISE_TOOL_INSTALL_PATH/cs"'

[tools."http:cs".platforms]
macos-arm64 = { url = "https://downloads.codescene.io/enterprise/cli/cs-macos-aarch64-b2580d71be8fbfd6a496d7a007062c0c81cd2b60.zip" }
linux-x64 = { url = "https://downloads.codescene.io/enterprise/cli/cs-linux-amd64-b2580d71be8fbfd6a496d7a007062c0c81cd2b60.zip" }
linux-arm64 = { url = "https://downloads.codescene.io/enterprise/cli/cs-linux-aarch64-b2580d71be8fbfd6a496d7a007062c0c81cd2b60.zip" }

# These apply to activated shells, mise exec, tasks and all nested Bazel modules.
# Keep the selected SDK root available even before its packages are installed.
[env]
ANDROID_SDK_ROOT = """\
{% if env.ANDROID_HOME | default(value='') %}{{ env.ANDROID_HOME }}\
{% elif env.ANDROID_SDK_ROOT | default(value='') %}{{ env.ANDROID_SDK_ROOT }}\
{% elif os() == 'macos' %}{{ env.HOME }}/Library/Android/sdk\
{% elif '/usr/local/lib/android/sdk' is dir %}/usr/local/lib/android/sdk\
{% elif '/opt/android-sdk' is dir %}/opt/android-sdk\
{% else %}{{ env.HOME }}/Android/Sdk{% endif %}\
"""
# rules_android accepts an unset/empty ANDROID_HOME for host-only builds, but
# rejects an SDK path without platforms, even when building just a formatter.
ANDROID_HOME = """\
{% set api = vars.android_api_levels | split(pat=',') | first %}\
{% if env.ANDROID_SDK_ROOT ~ '/platforms/android-' ~ api ~ '/android.jar' is file %}\
{{ env.ANDROID_SDK_ROOT }}{% endif %}\
"""
ANDROID_NDK_HOME = { default = "{{ env.ANDROID_SDK_ROOT }}/ndk/{{ vars.android_ndk_version }}" }
ANDROID_NDK_ROOT = "{{ env.ANDROID_NDK_HOME }}"
# The pinned build tools, which Android work such as inspect:mobile passes to its tools.
ANDROID_BUILD_TOOLS = "{{ vars.android_build_tools }}"

[tasks.bootstrap]
description = "Prepare repository toolchains, Android SDK components and Git hooks"
run = [
  "mise reshim",
  { task = "setup" },
  { task = "android:setup" },
]

[tasks.setup]
description = "Install the Git hooks from hk.pkl"
run = "hk install --mise"

[tasks."android:setup"]
description = "Install or repair the pinned Android SDK/NDK components"
run = "python3 -m tools.ci.work run android:setup"

[tasks.format]
description = "Format Python, Starlark and Bazel files in place"
# The formatters run here, so their binaries are resolved for this host (see shared.bazelrc).
run = "bazel run --config=host-execution //tools/format"

[tasks."api-docs"]
description = "Regenerate the ruleset's API reference after changing its public API"
dir = "rules_godot"
run = "bazel run //tools/docs"

[tasks."code-health"]
description = "Review the Code Health of the change since origin/main; fails when a file declines"
run = "python3 -m tools.code_health.codescene"

[tasks."code-health:survey"]
description = "Report the Code Health of the whole checkout: hotspots and the lowest scores"
run = "python3 -m tools.code_health.codescene --survey"

[tasks.lint]
description = "Lint everything: Ruff and ty, Buildifier's lint, the workflows and hk.pkl"
run = "python3 -m tools.ci.work run lint"

[tasks.check]
description = "Run the checks before a push: lint, setup, conventions, API docs and tooling tests"
run = "hk check"

[tasks.test]
description = "Run the repository tooling's tests and the ruleset's desktop tests"
run = "python3 -m tools.ci.work run test:tools test:bazel"

[tasks."ci:work"]
description = "Run pieces of the lanes' work by name, such as test:setup; none lists them"
usage = 'arg "[name]" var=#true help="the work to run, in order"'
run = "python3 -m tools.ci.work run $usage_name"

[tasks."ci:lane"]
description = "Run one CI lane's work on this host, as CI runs it"
usage = 'arg "<lane>" help="quality, docs, desktop, source-engine, android or ios"'
run = "python3 -m tools.ci.work lane {{usage.lane}}"
