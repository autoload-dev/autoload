# Repository verification commands; policy and matrix: docs/internal/verification.md.
min_version = "2026.10.15"

# mise.lock pins each tool's download URL and checksum per platform, and mise
# installs only what it lists. After changing [tools], run
# `mise lock --platform macos-arm64,linux-x64,linux-arm64`.
[settings]
lockfile = true

# Python comes from Astral's CDN, which serves the same files as the GitHub releases that
# mise.lock records, so the lock's checksums still apply.
[settings.url_replacements]
"https://github.com/astral-sh/python-build-standalone/releases/download/" = "https://releases.astral.sh/github/python-build-standalone/releases/download/"

[tool_config]
locked = true

[vars]
java_version = "temurin-21.0.13+9.0.LTS"
android_api_levels = "35,36"
android_build_tools = "35.0.0"
android_ndk_version = "29.0.14206865"
documentation_conventions = "RG004 RG006 RG013"

[tools]
bazelisk = "1.29.0"
hk = { version = "2.5.0", lazy = true }
java = { version = "{{ vars.java_version }}", lazy = true }
python = "3.14.6"

[wrappers]
bazel = "bazelisk"

# Fallback only: bootstrap first reuses an installed SDK and sdkmanager.
[tools."http:android-commandlinetools"]
version = "15859902"
lazy = true
lazy_bins = ["sdkmanager"]
strip_components = 1
bin_path = "bin"

[tools."http:android-commandlinetools".platforms]
macos-arm64 = { url = "https://dl.google.com/android/repository/commandlinetools-mac_arm64-{{ version }}_latest.zip" }
linux-x64 = { url = "https://dl.google.com/android/repository/commandlinetools-linux-{{ version }}_latest.zip" }
linux-arm64 = { url = "https://dl.google.com/android/repository/commandlinetools-linux-{{ version }}_latest.zip" }

# These apply to activated shells, mise exec, tasks and all nested Bazel modules.
# Keep the selected SDK root available even before its packages are installed.
[env]
ANDROID_SDK_ROOT = """\
{% if env.ANDROID_HOME | default(value='') %}{{ env.ANDROID_HOME }}\
{% elif env.ANDROID_SDK_ROOT | default(value='') %}{{ env.ANDROID_SDK_ROOT }}\
{% elif os() == 'macos' %}{{ env.HOME }}/Library/Android/sdk\
{% elif '/usr/local/lib/android/sdk' is dir %}/usr/local/lib/android/sdk\
{% elif '/opt/android-sdk' is dir %}/opt/android-sdk\
{% else %}{{ env.HOME }}/Android/Sdk{% endif %}\
"""
# rules_android accepts an unset/empty ANDROID_HOME for host-only builds, but
# rejects an SDK path without platforms, even when building just a formatter.
ANDROID_HOME = """\
{% set api = vars.android_api_levels | split(pat=',') | first %}\
{% if env.ANDROID_SDK_ROOT ~ '/platforms/android-' ~ api ~ '/android.jar' is file %}\
{{ env.ANDROID_SDK_ROOT }}{% endif %}\
"""
ANDROID_NDK_HOME = { default = "{{ env.ANDROID_SDK_ROOT }}/ndk/{{ vars.android_ndk_version }}" }
ANDROID_NDK_ROOT = "{{ env.ANDROID_NDK_HOME }}"

[tasks.bootstrap]
description = "Prepare repository toolchains, Android SDK components and Git hooks"
run = [
  "mise reshim",
  { task = "setup" },
  { task = "android:setup" },
]

[tasks.setup]
description = "Install the Git hooks from hk.pkl"
run = "hk install --mise"

[tasks.format]
description = "Format Python, Starlark and Bazel files in place"
# The formatters run here, so their binaries are resolved for this host (see shared.bazelrc).
run = "bazel run --config=host-execution //tools/format"

[tasks.lint]
description = "Check formatting, Buildifier lint, Ruff and ty, and validate hk.pkl"
run = [
  "bazel run --config=host-execution //tools/format:format.check",
  "bazel run --config=host-execution //tools/lint",
  "hk validate",
]

[tasks."lint:ci"]
description = "Check workflows, action metadata and Bazel cleanup"
tools.jactionlint = "2.4.0"
tools.node = "24.22.2"
run = [
  "jactionlint --shellcheck= --pyflakes=",
  "node --test .github/actions/setup/stop-bazel/post.test.js",
]

[tasks.docs]
description = "Check API source contracts, host evidence and generated reference"
dir = "{{config_root}}/rules_godot"
run = [
  "bazel run //tools/docs:check",
  "bazel run //tools/docs:contracts -- --lane docs",
  "bazel run //tools/docs:evaluated_mismatch_test",
]

# Configured API output contracts per lane; `docs` runs the docs lane's cases.
[tasks."contracts:host"]
description = "Check the host lane's API output contracts"
dir = "{{config_root}}/rules_godot"
run = "bazel run //tools/docs:contracts -- --lane host"

[tasks."contracts:source-engine"]
description = "Check the source-engine lane's API output contracts; needs macOS"
dir = "{{config_root}}/rules_godot"
run = "bazel run //tools/docs:contracts -- --lane source-engine"

[tasks."contracts:ios"]
description = "Check the iOS API output contracts; needs macOS with Xcode"
dir = "{{config_root}}/rules_godot"
run = "bazel run //tools/docs:contracts -- --lane ios"

[tasks.conventions]
description = "Check the repository conventions catalogue"
run = "bazel run //tools/conventions"

# Complementary rule sets; `conventions` runs both.
[tasks."conventions:code"]
description = "Check the conventions that apply to code and project structure"
run = "bazel run //tools/conventions -- {% for rule in vars.documentation_conventions | split(pat=' ') %}--exclude-rule {{ rule }} {% endfor %}"

[tasks."conventions:docs"]
description = "Check the conventions that apply to documentation"
run = "bazel run //tools/conventions -- {% for rule in vars.documentation_conventions | split(pat=' ') %}--rule {{ rule }} {% endfor %}"

# The docs task runs the ruleset's //docs and //tools/docs tests.
# The ruleset's host set, including its Android packaging tests (L1); tests that build an
# engine from source run in the source-engine lane.
[tasks."test:bazel"]
extends = "android"
description = "Run the ruleset's Bazel tests outside the documentation checks"
dir = "{{config_root}}/rules_godot"
run = "bazel test --build_tests_only --test_tag_filters=-source_engine -- //... -//docs/... -//tools/docs/..."

# The regression module's host set; its mobile tests are manual and run in their lanes.
[tasks."test:regressions"]
description = "Run the regression module's host tests as a consumer of the ruleset"
dir = "{{config_root}}/rules_godot/tests"
# The host set needs no Android SDK or NDK; an accidental dependency fails here.
env = { ANDROID_HOME = "", ANDROID_NDK_HOME = "" }
run = "bazel test //..."

[tasks."test:tools"]
description = "Run the Python tests of the repository's own tooling in the root module"
run = "bazel test //..."

[tasks."code-health"]
description = "Report Code Health of the checkout with the CodeScene CLI, Starlark and GDScript included"
run = "python3 -m tools.code_health.codescene"

[tasks."test:setup"]
description = "Check Android provisioning, the modules' shared pins and the mise environment"
run = [
  "python3 -m tools.android.requirements",
  "python3 -m tools.setup.pins",
  "python3 -m unittest tools.android.mise_test tools.android.requirements_test tools.setup.modules_test tools.setup.pins_test tools.addons.new_test tools.addons.lanes_test",
]

[tasks."test:gdextension"]
description = "Run the desktop smoke scenario of this host, on macOS also ad hoc signed"
dir = "{{config_root}}/rules_godot/tests"
run = [
  # Each desktop smoke scenario is compatible with its own host only; the other is skipped.
  "bazel test //smoke/linux/... //smoke/macos/...",
  "if [ \"$(uname -s)\" = Darwin ]; then bazel test //smoke/macos/... --@autoload_rules_godot//godot:macos_signing=adhoc; fi",
]

[tasks."test:example:sqlite"]
description = "Check and run the SQLite example's own tests"
dir = "{{config_root}}/rules_godot/examples"
run = "bazel test --build_tests_only //addons/sqlite/..."

[tasks."test:example:lichtpost"]
description = "Check and run Lichtpost's own tests"
dir = "{{config_root}}/rules_godot/examples"
run = "bazel test --build_tests_only //projects/lichtpost/..."

[tasks."test:example:petri"]
description = "Check and run Petri's own tests with its source-built engine"
dir = "{{config_root}}/rules_godot/examples"
run = "bazel test --build_tests_only --config=petri //projects/petri/..."

[tasks."test:example:platform_paths"]
description = "Check and run the Platform Paths example's own tests"
dir = "{{config_root}}/rules_godot/examples"
run = "bazel test --build_tests_only //addons/platform_paths/..."

[tasks."test:example:app_auth"]
description = "Check and run the AppAuth example's own tests"
dir = "{{config_root}}/rules_godot/examples"
run = "bazel test --build_tests_only //addons/app_auth/..."

[tasks."test:example:dart"]
description = "Check and run the Dart scripts example's own tests"
dir = "{{config_root}}/rules_godot/examples"
run = "bazel test --build_tests_only //addons/dart/..."

# The add-on modules' lanes, the same for every module in addons/ (tools/addons/lanes.py):
# each runs from the module's examples/, which consumes the module and the rules of this
# checkout. CI runs them per module from its addon.pkl (tools/ci/verification.py).
[tasks."addon:host"]
description = "Run an add-on module's tests and build its example projects for the editor and desktop"
usage = 'arg "<module>" help="The module directory below addons/"'
run = "python3 -m tools.addons.lanes host {{usage.module}}"

[tasks."addon:android"]
extends = "android"
description = "Build an add-on module's example Android apps"
usage = 'arg "<module>" help="The module directory below addons/"'
run = "python3 -m tools.addons.lanes android {{usage.module}}"

[tasks."addon:ios"]
description = "Build an add-on module's example iOS Simulator apps; needs macOS with Xcode"
usage = 'arg "<module>" help="The module directory below addons/"'
run = "python3 -m tools.addons.lanes ios {{usage.module}}"

[tasks."addon:new"]
description = "Create an add-on module, or add an add-on to one, from the template"
usage = """
arg "<module>" help="The module directory below addons/, such as firebase"
flag "--addon <addon>" help="The add-on directory in the module; the module name by default"
"""
run = "python3 -m tools.addons.new {{usage.module}} --addon '{{usage.addon}}'"

# The generator's self-test: generates addons/.selftest (gitignored) and runs its lane.
[tasks."addon:template"]
description = "Generate a module from the add-on template and run one of its lanes"
usage = 'arg "<lane>" help="host, android or ios"'
# Only the Android lane reads the examples' Maven graph, so only it pins one.
run = [
  "python3 -m tools.addons.new .selftest {% if usage.lane != 'android' %}--no-pin{% endif %}",
  "mise run addon:{{usage.lane}} .selftest",
]

[tasks."test:examples"]
description = "Check and run all examples through their own public test targets"
dir = "{{config_root}}/rules_godot/examples"
run = "bazel test --build_tests_only //..."

[tasks."test:full"]
description = "Run the full host suite explicitly; routine selection uses the host lane's profile"
run = [
  { task = "test:setup" },
  { task = "test:tools" },
  { task = "test:bazel" },
  { task = "test:regressions" },
  { task = "test:gdextension" },
  { task = "test:examples" },
]

# The ruleset's tests tagged source_engine build an engine from source, some for Android.
# They are also manual, so `//...` in the host set never analyzes their source recipes.
# This task runs a quicker subset; source-engine:full, which CI runs in the Source engine
# workflow, runs every case (docs/internal/verification-platforms.md#source-engine-workflow).
[tasks.source-engine]
extends = "android"
description = "Build and run the main cases of source-built engines headless; needs macOS"
dir = "{{config_root}}/rules_godot/tests"
run = [
  "cd {{config_root}}/rules_godot && bazel query 'attr(tags, \"\\bsource_engine\\b\", tests(//godot/...)) except attr(tags, \"\\bsource_engine_extended\\b\", tests(//godot/...))' | xargs bazel test",
  # A fuller editor and a reduced runtime of one snapshot, each with the custom module.
  "bazel test //patched_engine/tests:app_runs_patched_engine_test //patched_engine/tests:source_built_editor_test --extra_toolchains=//patched_engine/engines/source:all",
]

[tasks."source-engine:full"]
extends = "android"
description = "Build and run every case of source-built engines headless, Petri's included; needs macOS"
dir = "{{config_root}}/rules_godot/tests"
run = [
  "cd {{config_root}}/rules_godot && bazel query 'attr(tags, \"\\bsource_engine\\b\", tests(//godot/...))' | xargs bazel test",
  "bazel test //patched_engine/tests:app_runs_patched_engine_test --extra_toolchains=//patched_engine/engines/stable:all",
  "bazel test //patched_engine/tests:app_runs_patched_engine_test --extra_toolchains=//patched_engine/engines/beta:all",
  "bazel test //patched_engine/tests:app_runs_patched_engine_test //patched_engine/tests:source_built_editor_test --extra_toolchains=//patched_engine/engines/source:all",
  { task = "test:example:petri" },
]

# The mobile tasks run the consumer module's configuration suites (tests/BUILD.bazel).
[tasks."ios:apps"]
description = "Build the iOS smoke app and inspect its linked extension"
dir = "{{config_root}}/rules_godot/tests"
run = "bazel test //:ios_official --config=official"

[tasks."ios:examples"]
description = "Build the example iOS apps and their release symbols"
dir = "{{config_root}}/rules_godot/examples"
run = [
  "bazel build //addons/sqlite/demo:app //addons/sqlite/demo:app.debug_symbols //projects/lichtpost:app //projects/lichtpost:app.debug_symbols //addons/platform_paths/demo:app //addons/platform_paths/demo:app.debug_symbols //addons/app_auth/demo:app //addons/app_auth/demo:app.debug_symbols --config=ios-release",
]

[tasks.ios]
description = "Run all ios:* tasks; needs macOS with Xcode"
run = [
  { task = "ios:apps" },
  { task = "ios:examples" },
]

[tasks."android:setup"]
description = "Install or repair the pinned Android SDK/NDK components"
tools.java = { version = "{{ vars.java_version }}", lazy = false }
env.ANDROID_HOME = "{{ env.ANDROID_SDK_ROOT }}"
run = [
  "python3 -m tools.android.requirements",
  "python3 tools/android/sdk.py",
]

[task_templates.android]
tools.java = { version = "{{ vars.java_version }}", lazy = false }
env.ANDROID_HOME = "{{ env.ANDROID_SDK_ROOT }}"
depends = ["android:setup"]

[tasks."contracts:android"]
extends = "android"
description = "Check the Android API output contracts"
dir = "{{config_root}}/rules_godot"
run = "bazel run //tools/docs:contracts -- --lane android"

[tasks."android:apps"]
extends = "android"
description = "Build the Android smoke App Bundle and inspect its packaged extension and pack"
dir = "{{config_root}}/rules_godot/tests"
run = "bazel test //:android_aab --config=android --config=aab"

[tasks."inspect:mobile"]
extends = "android"
description = "Inspect already built Android and iOS artifacts; needs macOS"
dir = "{{config_root}}/rules_godot"
run = """
bazel run //tools/platforms:validate_artifacts -- \
  --android-sdk "$ANDROID_HOME" --android-ndk "$ANDROID_NDK_HOME" \
  --java "$JAVA_HOME/bin/java" \
  --build-tools "{{ vars.android_build_tools }}"
"""

[tasks."android:examples"]
extends = "android"
description = "Build the examples' Android APKs, bundles and symbols"
dir = "{{config_root}}/rules_godot/examples"
run = [
  "bazel build //addons/sqlite/demo:app //projects/lichtpost:app //addons/platform_paths/demo:app //addons/app_auth/demo:app --config=android",
  "bazel build //addons/sqlite/demo:app --config=multi_abi --config=aab",
  "bazel build //addons/sqlite/demo:app //addons/sqlite/demo:app.debug_symbols //addons/platform_paths/demo:app //addons/platform_paths/demo:app.debug_symbols //addons/app_auth/demo:app //addons/app_auth/demo:app.debug_symbols --config=android-release --config=aab",
]

[tasks.android]
description = "Build and inspect the Android smoke app and the examples' Android apps"
run = [
  { task = "android:apps" },
  { task = "android:examples" },
]
