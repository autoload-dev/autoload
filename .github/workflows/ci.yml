name: CI

on:
  pull_request:
  # The merge queue runs every selected lane on the result of the merge.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  # macos-preview.yml calls this workflow for a pull request labelled ci:macos.
  workflow_call:
    inputs:
      apple-only:
        description: Run only the selected Apple lanes.
        type: boolean
        default: false

permissions:
  contents: read

# hk.pkl selects tasks for both local verification and CI. The selection job
# avoids provisioning runners for unrelated changes. A pull request's run
# leaves out the selected Apple lanes; the merge queue, main and dispatch run
# them, and so does the macOS preview of a pull request labelled ci:macos.
# Policy: docs/internal/verification-platforms.md#apple-lanes-on-pull-requests.

# Blacksmith provisions its Bazel remote cache for build outputs before the job
# starts. Do not layer a disk cache or a second remote cache on top of it;
# .github/actions/setup keeps only Bazel's downloads between runs, on Linux
# with the extracted repositories.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Select verification
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.plan.outputs.quality }}
      docs: ${{ steps.plan.outputs.docs }}
      host: ${{ steps.plan.outputs.host }}
      source_engine: ${{ steps.plan.outputs['source-engine'] }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up selection tools
        uses: ./.github/actions/setup
        with:
          bazel: "false"
      - name: Select verification tasks
        id: plan
        run: python3 tools/ci/verification.py plan

  formatting:
    name: Source quality
    needs: selection
    if: ${{ !inputs.apple-only && needs.selection.outputs.quality != '[]' }}
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.quality }}
    timeout-minutes: 10
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          bazel-modules: |
            .
            examples
            tests
      - name: Check source quality and setup contracts
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"

  api-docs:
    name: API documentation
    needs: selection
    if: ${{ !inputs.apple-only && needs.selection.outputs.docs != '[]' }}
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.docs }}
    timeout-minutes: 15
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
      - name: Check API docs
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"

  tests-linux:
    needs: selection
    if: ${{ !inputs.apple-only && needs.selection.outputs.host != '[]' }}
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.host }}
    name: Tests (Linux)
    timeout-minutes: 30
    # Uncached Godot imports and exports are CPU-bound; 4 vCPUs ran 4 at a time.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps: &tests-steps
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          # The ruleset's host set includes its Android packaging tests.
          android-cache: "true"
          bazel-modules: |
            .
            examples
            tests
      # The regression module's host set runs first, so that the output base check sees
      # only its repositories: later host tasks may configure Android targets.
      - name: Run the regression module's host set
        if: contains(env.VERIFICATION_TASKS, '"test:regressions"')
        run: python3 tools/ci/verification.py run '["test:regressions"]'
      - name: Require a regression host set without Android tools
        if: contains(env.VERIFICATION_TASKS, '"test:regressions"')
        working-directory: tests
        run: |
          external="$(bazel info output_base)/external"
          # rules_jvm_external++maven+ prefixes the hub and artifact repositories of both
          # Maven installs, maven and rules_android_maven.
          if ls "$external" | grep -E 'rules_jvm_external\+\+maven\+|android_toolchains'; then
            echo "The regression module's host set fetched Android tools or Maven artifacts" >&2
            exit 1
          fi
      - name: Run tests
        run: python3 tools/ci/verification.py run "$(jq -c 'map(select(. != "test:regressions"))' <<< "$VERIFICATION_TASKS")"
      - name: Save Bazel downloads
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup/save-downloads

  tests-macos:
    name: Tests (macOS)
    needs: selection
    if: >-
      needs.selection.outputs.host != '[]' &&
      (inputs.apple-only || github.event_name != 'pull_request')
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.host }}
    timeout-minutes: 30
    runs-on: blacksmith-6vcpu-macos-26
    steps: *tests-steps

  source-engine:
    name: Source engine
    needs: selection
    if: >-
      needs.selection.outputs.source_engine != '[]' &&
      (inputs.apple-only || github.event_name != 'pull_request')
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.source_engine }}
    timeout-minutes: 60
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          # The ruleset's source_engine tests include Android source builds.
          android-cache: "true"
          bazel-modules: |
            .
            tests
      - name: Run apps with source-built engines
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"
      - name: Save Bazel downloads
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup/save-downloads

  android:
    name: Android
    needs: selection
    if: ${{ !inputs.apple-only && needs.selection.outputs.android != '[]' }}
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.android }}
    timeout-minutes: 60
    # Uncached Godot, Java and dex actions are CPU-bound, as in Tests (Linux).
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          android-cache: "true"
          bazel-modules: |
            .
            tests
            examples
      - name: Build and inspect apps
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"

  ios:
    name: iOS
    needs: selection
    if: >-
      needs.selection.outputs.ios != '[]' &&
      (inputs.apple-only || github.event_name != 'pull_request')
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.ios }}
    timeout-minutes: 60
    runs-on: blacksmith-6vcpu-macos-26
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          bazel-modules: |
            .
            tests
            examples
      - name: Build and inspect apps
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"
      - name: Save Bazel downloads
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup/save-downloads

  verification:
    name: Verification result
    # The preview's lanes report for themselves; this result is the pull
    # request's and the merge queue's required check.
    if: ${{ always() && !inputs.apple-only }}
    needs: [selection, formatting, api-docs, tests-linux, tests-macos, source-engine, android, ios]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require selected jobs to succeed
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
          APPLE_REQUIRED: ${{ github.event_name != 'pull_request' }}
        run: |
          args=()
          if [ "$APPLE_REQUIRED" = true ]; then args+=(--apple-required); fi
          python3 tools/ci/verification.py verify "${args[@]}"
