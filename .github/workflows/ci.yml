name: CI

on:
  pull_request:
  # The merge queue runs every selected lane on the result of the merge. Main
  # then receives that commit unchanged, so a push to main runs nothing again.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Every run runs every lane; Bazel's caches keep unchanged work cheap. The plan
# job (tools/ci/verification.py) assigns the lanes' tasks to the jobs and their
# hosts, and leaves the source engines to their schedule. The jobs that need a macOS
# runner run on the self-hosted macos-ci runners, which keep their caches
# between jobs. Policy: docs/internal/verification-platforms.md#apple-lanes.

# Blacksmith provisions its Bazel remote cache for build outputs before the job
# starts. Do not layer a disk cache or a second remote cache on top of it;
# .github/actions/setup keeps only Bazel's downloads between runs, on Linux
# with the extracted repositories. The merge queue saves the caches that later
# runs read: Blacksmith's branch protection for the Actions cache and sticky
# disks is off, so every branch reads the entries of a merge group's branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Plan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    # One output per job, named like it; a host job's _android one says whether it needs
    # the Android SDK.
    outputs:
      formatting: ${{ steps.plan.outputs.formatting }}
      api_docs: ${{ steps.plan.outputs.api_docs }}
      tests_linux: ${{ steps.plan.outputs.tests_linux }}
      tests_linux_android: ${{ steps.plan.outputs.tests_linux_android }}
      tests_macos: ${{ steps.plan.outputs.tests_macos }}
      tests_macos_android: ${{ steps.plan.outputs.tests_macos_android }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up planning tools
        uses: ./.github/actions/setup
        with:
          bazel: "false"
      - name: Plan verification tasks
        id: plan
        run: python3 tools/ci/verification.py plan

  formatting:
    name: Source quality
    needs: selection
    if: needs.selection.outputs.formatting != '[]'
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.formatting }}
    timeout-minutes: 10
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
      - name: Check source quality and setup contracts
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"

  api-docs:
    name: API documentation
    needs: selection
    if: needs.selection.outputs.api_docs != '[]'
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.api_docs }}
    timeout-minutes: 15
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
      - name: Check API docs
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"

  tests-linux:
    name: Tests (Linux)
    needs: selection
    if: needs.selection.outputs.tests_linux != '[]'
    timeout-minutes: 30
    # Uncached Godot imports and exports are CPU-bound; 4 vCPUs ran 4 at a time.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run host tests
        uses: ./.github/actions/host-tests
        with:
          tasks: ${{ needs.selection.outputs.tests_linux }}
          android: ${{ needs.selection.outputs.tests_linux_android }}

  tests-macos:
    name: Tests (macOS)
    needs: selection
    if: needs.selection.outputs.tests_macos != '[]'
    timeout-minutes: 30
    runs-on: macos-ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run host tests
        uses: ./.github/actions/host-tests
        with:
          tasks: ${{ needs.selection.outputs.tests_macos }}
          android: ${{ needs.selection.outputs.tests_macos_android }}

  android:
    name: Android
    needs: selection
    if: needs.selection.outputs.android != '[]'
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.android }}
    timeout-minutes: 60
    # Uncached Godot, Java and dex actions are CPU-bound, as in Tests (Linux).
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          android-cache: "true"
      - name: Build and inspect apps
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"

  ios:
    name: iOS
    needs: selection
    if: needs.selection.outputs.ios != '[]'
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.ios }}
    timeout-minutes: 60
    runs-on: macos-ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
      - name: Build and inspect apps
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"
      - name: Save Bazel downloads
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup/save-downloads

  verification:
    name: Finalize
    if: always()
    needs: [selection, formatting, api-docs, tests-linux, tests-macos, android, ios]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require selected jobs to succeed
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/verification.py verify
