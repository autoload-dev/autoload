name: CI

on:
  pull_request:
  # The merge queue runs every lane on the result of the merge. Main
  # then receives that commit unchanged, so a push to main runs nothing again.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Every run runs every lane; Bazel's caches keep unchanged work cheap. Each job
# runs one lane's work (tools/ci/work.py) for its host; the source engines run
# on their own schedule (source-engine.yml). The jobs that need a macOS runner
# run on the self-hosted macos-ci runners, which keep their caches between jobs
# and run no code of a fork's pull request.
# Policy: docs/internal/verification-platforms.md#apple-lanes.

# Blacksmith provisions its Bazel remote cache for build outputs before the job
# starts. Do not layer a disk cache or a second remote cache on top of it;
# .github/actions/setup keeps only Bazel's downloads between runs, on Linux
# with the extracted repositories. The merge queue saves the caches that later
# runs read: Blacksmith's branch protection for the Actions cache and sticky
# disks is off, so every branch reads the entries of a merge group's branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Source quality
    timeout-minutes: 10
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
      - name: Check source quality and setup contracts
        run: python3 -m tools.ci.work lane quality

  api-docs:
    name: API documentation
    timeout-minutes: 15
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
      - name: Check API docs
        run: python3 -m tools.ci.work lane docs

  tests-linux:
    name: Tests (Linux)
    timeout-minutes: 30
    # Uncached Godot imports and exports are CPU-bound; 4 vCPUs ran 4 at a time.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run desktop tests
        uses: ./.github/actions/desktop-tests

  tests-macos:
    name: Tests (macOS)
    # A fork's pull request reaches the self-hosted runners only in the merge queue.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    runs-on: macos-ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run desktop tests
        uses: ./.github/actions/desktop-tests

  android:
    name: Android
    timeout-minutes: 60
    # Uncached Godot, Java and dex actions are CPU-bound, as in Tests (Linux).
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          android-cache: "true"
      - name: Build and inspect apps
        run: python3 -m tools.ci.work lane android

  ios:
    name: iOS
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    runs-on: macos-ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
      - name: Build and inspect apps
        run: python3 -m tools.ci.work lane ios
      - name: Save Bazel downloads
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup/save-downloads

  # The merge queue's required check: one name, whichever jobs the workflow has.
  verification:
    name: Finalize
    if: always()
    needs: [formatting, api-docs, tests-linux, tests-macos, android, ios]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "A job did not succeed: $RESULTS" >&2
          exit 1
