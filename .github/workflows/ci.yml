name: CI

on:
  pull_request:
  # The merge queue runs every job on the result of the merge. Main
  # then receives that commit unchanged, so a push to main runs nothing again.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Every run runs every host's job; Bazel's caches keep unchanged work cheap. Each job runs
# `aspect ci <host>` (.aspect/develop.axl): on Linux every check, then every test of the
# root module and the ruleset that the host's config `ci-<host>` selects by tag
# (shared.bazelrc), in one `bazel test` per module. The source engines run in a workflow of
# their own (source-engine.yml). The macOS job runs on the self-hosted macos-ci runners, which keep
# their repository cache and Bazel servers between jobs and share a Bazel cache server with
# their host.
# Policy: docs/internal/verification-platforms.md#apple-hosts.

# Blacksmith provisions its Bazel remote cache for build outputs before the job
# starts. Do not layer a disk cache or a second remote cache on top of it;
# .github/actions/setup keeps only Bazel's repository cache between runs, on a
# sticky disk, and the missing Android SDK components. The merge queue saves the caches that later
# runs read: Blacksmith's branch protection for the Actions cache and sticky
# disks is off, so every branch reads the entries of a merge group's branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The merge queue requires both jobs by name, Linux and macOS (the repository's ruleset for
# main).
jobs:
  hosts:
    name: ${{ matrix.host.name }}
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 60
    strategy:
      # The first job to fail cancels the other, which frees its runner and fails the merge
      # queue's entry at once; the work it finished stays in the caches.
      fail-fast: true
      matrix:
        host:
          # Checks, desktop and Android: uncached Godot imports and exports, Java and dex
          # actions are CPU-bound.
          - id: linux
            name: Linux
            runner: blacksmith-16vcpu-ubuntu-2404
          - id: macos
            name: macOS
            runner: macos-ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
      # A stale MODULE.bazel.lock fails every Bazel command of the job, in the root
      # module and the ruleset, rather than be rewritten (--config=ci, shared.bazelrc).
      - name: Check MODULE.bazel.lock
        run: echo "common --config=ci" > ci.bazelrc
      - name: Run the host's job
        run: aspect ci ${{ matrix.host.id }}

