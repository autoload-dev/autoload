name: CI

on:
  pull_request:
  # The merge queue runs every lane on the result of the merge. Main
  # then receives that commit unchanged, so a push to main runs nothing again.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Every run runs every lane; Bazel's caches keep unchanged work cheap. Each job
# runs one lane's work (tools/ci/work.py) for its host; the source engines run
# on their own schedule (source-engine.yml). The jobs that need a macOS runner
# run on the self-hosted macos-ci runners, which keep their caches between jobs
# and run no code of a fork's pull request.
# Policy: docs/internal/verification-platforms.md#apple-lanes.

# Blacksmith provisions its Bazel remote cache for build outputs before the job
# starts. Do not layer a disk cache or a second remote cache on top of it;
# .github/actions/setup keeps only Bazel's downloads between runs, on Linux
# with the extracted repositories. The merge queue saves the caches that later
# runs read: Blacksmith's branch protection for the Actions cache and sticky
# disks is off, so every branch reads the entries of a merge group's branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lanes:
    name: ${{ matrix.lane.name }}
    runs-on: ${{ matrix.lane.runner }}
    timeout-minutes: ${{ matrix.lane.timeout }}
    strategy:
      # The first lane to fail cancels the others, which frees their runners and
      # lets Finalize fail at once; the work they finished stays in the caches.
      fail-fast: true
      # Each lane keeps the caches of the job it was before the matrix (job).
      # Uncached Godot imports and exports, Java and dex actions are CPU-bound;
      # 4 vCPUs ran 4 at a time, so the lanes that build them take 8.
      matrix:
        lane:
          - job: formatting
            name: Source quality
            work: quality
            # Lint analyses every module's Python targets, the ruleset's applications with them,
            # which 2 vCPUs did not do within the limit.
            runner: blacksmith-8vcpu-ubuntu-2404
            timeout: 10
          - job: api-docs
            name: API documentation
            work: docs
            runner: blacksmith-2vcpu-ubuntu-2404
            timeout: 15
          - job: tests-linux
            name: Tests (Linux)
            work: desktop
            runner: blacksmith-8vcpu-ubuntu-2404
            timeout: 30
            # The ruleset's desktop set includes its Android packaging tests.
            android-cache: "true"
          - job: tests-macos
            name: Tests (macOS)
            work: desktop
            runner: macos-ci
            timeout: 30
            android-cache: "true"
          - job: android
            name: Android
            work: android
            runner: blacksmith-8vcpu-ubuntu-2404
            timeout: 60
            android-cache: "true"
          - job: ios
            name: iOS
            work: ios
            runner: macos-ci
            timeout: 60
        # A fork's pull request reaches the self-hosted runners only in the merge
        # queue. An entry matches an exclusion on the fields the exclusion names.
        exclude:
          - lane:
              runner: >-
                ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name != github.repository
                && 'macos-ci' || 'none' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          android-cache: ${{ matrix.lane.android-cache || 'false' }}
          cache-name: ${{ matrix.lane.job }}
      # A stale MODULE.bazel.lock fails every Bazel command of the lane, in the root
      # module and the ruleset, rather than be rewritten (--config=ci, shared.bazelrc).
      - name: Check MODULE.bazel.lock
        run: echo "common --config=ci" > ci.bazelrc
      - name: Run the lane's work
        run: aspect lane ${{ matrix.lane.work }}
      - name: Save Bazel downloads
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup/save-downloads

  # The merge queue's required check: one name, whichever jobs the workflow has.
  verification:
    name: Finalize
    if: always()
    needs: [lanes]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "A job did not succeed: $RESULTS" >&2
          exit 1
