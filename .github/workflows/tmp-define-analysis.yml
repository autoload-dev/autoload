name: Temporary define analysis on Linux

# Temporary: reproduces the define analysis failure of Linux source recipes. Removed before
# the pull request merges.
on:
  push:
    branches: [claude/define-analysis-linux]

permissions:
  contents: read

jobs:
  define-analysis:
    name: Define analysis on Linux (temporary)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
      - name: Check MODULE.bazel.lock
        run: echo "common --config=ci" > ci.bazelrc
      - name: Set up the Android SDK
        run: aspect work android:setup
      - name: Root module source-engine tests
        run: >-
          aspect exec -- bazel test --config=source-engine --keep_going
          --test_tag_filters=source_engine,-ios -- //...
