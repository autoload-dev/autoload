name: Apple

# The lanes that need a macOS runner: the host tests on macOS, the apps with
# source-built engines and the iOS apps. CI calls this workflow with its plan on
# pull requests, in the merge queue and on dispatch; the Source engine workflow
# calls it on its schedule. The macOS jobs run on the self-hosted runners labelled
# macos-ci, which keep their caches between jobs.
# Policy: docs/internal/verification-platforms.md#apple-lanes.
on:
  workflow_call:
    inputs:
      plan:
        description: The caller's plan of the Apple lanes, the selection outputs below as JSON.
        type: string
        required: true

permissions:
  contents: read

# A called run has its caller's name in its group and ends with the caller's run.
concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Plan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    # Arrays and booleans of the handed plan become the JSON text CI's plan step writes.
    outputs:
      host: ${{ toJSON(fromJSON(inputs.plan).host) }}
      source_engine: ${{ toJSON(fromJSON(inputs.plan)['source-engine']) }}
      ios: ${{ toJSON(fromJSON(inputs.plan).ios) }}
      host_android: ${{ toJSON(fromJSON(inputs.plan).host_android) }}
    steps:
      - name: Use the caller's plan
        env:
          PLAN: ${{ inputs.plan }}
        run: jq . <<< "$PLAN"

  tests-macos:
    name: Tests (macOS)
    needs: selection
    if: needs.selection.outputs.host != '[]'
    timeout-minutes: 30
    runs-on: macos-ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run host tests
        uses: ./.github/actions/host-tests
        with:
          tasks: ${{ needs.selection.outputs.host }}
          android: ${{ needs.selection.outputs.host_android }}

  source-engine:
    name: Source engine
    needs: selection
    if: needs.selection.outputs.source_engine != '[]'
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.source_engine }}
    timeout-minutes: 60
    runs-on: macos-ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          # The ruleset's source_engine tests include Android source builds.
          android-cache: "true"
          bazel-modules: |
            .
            tests
      - name: Run apps with source-built engines
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"
      - name: Save Bazel downloads
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup/save-downloads

  ios:
    name: iOS
    needs: selection
    if: needs.selection.outputs.ios != '[]'
    env:
      VERIFICATION_TASKS: ${{ needs.selection.outputs.ios }}
    timeout-minutes: 60
    runs-on: macos-ci
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          bazel-modules: |
            .
            tests
            examples
      - name: Build and inspect apps
        run: python3 tools/ci/verification.py run "$VERIFICATION_TASKS"
      - name: Save Bazel downloads
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup/save-downloads

  result:
    name: Finalize
    if: always()
    needs: [selection, tests-macos, source-engine, ios]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require selected jobs to succeed
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/verification.py verify apple
