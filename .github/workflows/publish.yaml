# Open a pull request that adds a release to the Bazel Central Registry.
name: Publish to BCR
on:
  # Called by release.yaml after a successful release.
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      publish_token:
        required: true
  # Retry by hand from the GitHub UI if publishing failed.
  workflow_dispatch:
    inputs:
      tag_name:
        description: git tag being released
        required: true
        type: string
jobs:
  publish:
    # https://github.com/bazel-contrib/publish-to-bcr/blob/main/.github/workflows/publish.yaml
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.7.0
    with:
      tag_name: ${{ inputs.tag_name }}
      # The fork of bazelbuild/bazel-central-registry the pull request is opened from.
      registry_fork: autoload-dev/bazel-central-registry
      # Opened with a personal token, the maintainer marks the draft ready for review,
      # which the registry counts as the maintainer's approval.
      draft: true
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}
