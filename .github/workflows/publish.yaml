# Open a pull request that adds a release to the Bazel Central Registry.
name: Publish to BCR
on:
  # Called by release.yaml after a successful release.
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      publish_token:
        required: true
  # Retry by hand from the GitHub UI if publishing failed.
  workflow_dispatch:
    inputs:
      tag_name:
        description: git tag being released
        required: true
        type: string
jobs:
  module:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.module.outputs.name }}
      root: ${{ steps.module.outputs.root }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the tag's module
        id: module
        env:
          TAG: ${{ inputs.tag_name }}
        run: python3 tools/ci/release_module.py "$TAG" >> "$GITHUB_OUTPUT"
  publish:
    needs: module
    # https://github.com/bazel-contrib/publish-to-bcr/blob/main/.github/workflows/publish.yaml
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.7.0
    with:
      tag_name: ${{ inputs.tag_name }}
      # Publish only the tag's module: without module_roots, one run publishes every root
      # of .bcr/config.yml.
      tag_prefix: ${{ needs.module.outputs.name }}-v
      module_roots: ${{ needs.module.outputs.root }}
      # The fork of bazelbuild/bazel-central-registry the pull request is opened from.
      registry_fork: autoload-dev/bazel-central-registry
      # Opened with a personal token, the maintainer marks the draft ready for review,
      # which the registry counts as the maintainer's approval.
      draft: true
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}
