name: Source engine

# The only CI run of the source-engine tests: it builds and runs every source-engine case
# on main on the schedule below, on any branch on manual dispatch, and on a pull request
# labelled `source-engine` when it is labelled and on each push while it has the label.
# Merges leave them out. Policy:
# docs/internal/verification-platforms.md#source-engine-workflow.
on:
  schedule:
    # GitHub starts scheduled runs late under load, worst at the top of the hour: runs meant
    # for 03:00 in Berlin started between 10:23 and 12:04 UTC, while the daytime CI ran. An
    # off-hour minute in the night of UTC and Berlin alike keeps the run ahead of the day.
    - cron: "37 0 * * *"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch replaces one still building engines.
concurrency:
  group: source-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-engine:
    name: Source engine
    timeout-minutes: 60
    runs-on: macos-ci
    # A pull request runs only with the label, when it gets the label rather than another, and
    # never a fork's on the self-hosted runners.
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'source-engine')
      && (github.event.action != 'labeled' || github.event.label.name == 'source-engine')
      && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository
        uses: ./.github/actions/setup
        with:
          # The ruleset's source_engine tests include Android source builds.
          android-cache: "true"
      # A stale MODULE.bazel.lock fails the job's Bazel commands (--config=ci, shared.bazelrc).
      - name: Check MODULE.bazel.lock
        run: echo "common --config=ci" > ci.bazelrc
      - name: Run apps with source-built engines
        run: aspect ci source-engine
      - name: Save Bazel downloads
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup/save-downloads
