name: macOS preview

# The selected Apple lanes of a pull request labelled ci:macos, before the
# merge queue runs them. Its checks are its own, beside those of the CI run.
# Policy: docs/internal/verification-platforms.md#apple-lanes-on-pull-requests.
on:
  # A label set when the pull request is opened arrives as a labeled event too.
  pull_request:
    types: [synchronize, reopened, labeled]

permissions:
  contents: read

# A new commit replaces the running preview; removing the label does not stop
# it. Only a labeled event names a label: another label starts a run that
# skips the lanes, and its own group keeps it from cancelling a preview.
concurrency:
  group: >-
    macos-preview-${{ github.ref }}-${{
    (github.event.label.name || 'ci:macos') == 'ci:macos' && 'lanes' || github.run_id }}
  cancel-in-progress: true

jobs:
  lanes:
    name: Apple lanes
    # The label starts the lanes, and so does each commit while it is set.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ci:macos') &&
      (github.event.label.name || 'ci:macos') == 'ci:macos'
    uses: ./.github/workflows/ci.yml
    with:
      apple-only: true
