name: Set up repository
description: >-
  Install and cache mise tools, reuse SDK components, and configure Bazel
  repository caching and cleanup. A persistent runner keeps its tools, SDK
  components and Bazel caches on its own disk between jobs, and its machine
  configures Bazel, so the cache service and ~/.bazelrc steps are left out there.

inputs:
  bazel:
    description: Set up runner tools (Bazelisk, Python, compilers), Bazel caching and cleanup; disable for selection-only jobs.
    default: "true"
  bazel-modules:
    description: Newline-separated Bazel module directories to shut down at job end; the add-on modules a build ran in are shut down as well.
    default: .
  android-cache:
    description: Cache Android SDK components missing from the runner.
    default: "false"

runs:
  using: composite
  steps:
    # GitHub's and Blacksmith's runners start every job fresh: caches come from the
    # cache service and Bazel settings go into ~/.bazelrc. A persistent runner, such as
    # the macos-ci runners, keeps its disk between jobs and runs jobs side by side; its
    # machine sets PERSISTENT_RUNNER and BAZEL_REPOSITORY_CACHE in the runner's
    # environment and configures Bazel in /etc/bazel.bazelrc. Linux runners' sticky
    # disk, like a persistent runner's disk, keeps the repository cache between jobs.
    # Blacksmith's runners count as self-hosted to GitHub, so runner.environment
    # cannot tell the two kinds apart.
    - name: Classify runner
      id: runner
      shell: bash
      run: |
        fresh=$([[ "${PERSISTENT_RUNNER:-}" == true ]] && echo false || echo true)
        persistent=$([[ "$fresh" == false || "$RUNNER_OS" == Linux ]] && echo true || echo false)
        {
          echo "fresh=$fresh"
          echo "persistent-disk=$persistent"
        } >> "$GITHUB_OUTPUT"
    # A persistent runner keeps its Bazel output bases between jobs, and keeps their Bazel
    # servers with their analysis caches too unless it stops them at the job's end: it stops
    # the processes that carry the job's RUNNER_TRACKING_ID. A later job's server then
    # analyzes only what changed. The machine bounds how long an idle server stays.
    - name: Keep Bazel servers between jobs
      if: steps.runner.outputs.fresh == 'false'
      shell: bash
      run: echo "RUNNER_TRACKING_ID=" >> "$GITHUB_ENV"
    # Runner images may select an older NDK. Empty values let mise apply the
    # repository default while preserving its local override policy.
    - name: Clear runner NDK defaults
      shell: bash
      run: |
        echo "ANDROID_NDK_HOME=" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=" >> "$GITHUB_ENV"
    # mise-action downloads mise, and verifies a cached mise, through GitHub releases unless
    # mise is in place with a known checksum. This step places the pinned mise from mise's
    # CDN, or from the GitHub release if the CDN fails. The archive checksums are the
    # entries of the release's minisign-signed SHASUMS256.txt.
    - name: Download mise
      id: mise
      shell: bash
      env:
        MISE_VERSION: 2026.10.15
        MISE_SHA256_LINUX_X64: 1c2d85dc42bef51e0bb20780093c746d6e12dfd15ca461f3979bd52cc214bc19
        MISE_SHA256_MACOS_ARM64: 8a44a56f72323c777298a1d5abd88ffd21d0fca19fab1ccccd389a912374f69c
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=linux-x64 archive_sha256=$MISE_SHA256_LINUX_X64 ;;
          macOS-ARM64) target=macos-arm64 archive_sha256=$MISE_SHA256_MACOS_ARM64 ;;
          *) echo "No pinned mise for $RUNNER_OS $RUNNER_ARCH" >&2; exit 1 ;;
        esac
        asset="mise-v$MISE_VERSION-$target.tar.gz"
        archive="$RUNNER_TEMP/$asset"
        verified=false
        for url in "https://mise.jdx.dev/v$MISE_VERSION/$asset" \
          "https://github.com/jdx/mise/releases/download/v$MISE_VERSION/$asset"; do
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 -o "$archive" "$url" &&
            echo "$archive_sha256  $archive" | shasum -a 256 -c --status &&
            verified=true && echo "Downloaded $asset from $url" && break
          echo "::warning::Could not download a verified $asset from $url"
        done
        [[ "$verified" == true ]] || exit 1
        # mise-action's default data directory; it restores its cache there.
        bin="${MISE_DATA_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/mise}/bin"
        mkdir -p "$bin"
        tar -xzf "$archive" -C "$RUNNER_TEMP" mise/bin/mise
        mv "$RUNNER_TEMP/mise/bin/mise" "$bin/mise"
        # With the binary's checksum, mise-action verifies it without GitHub.
        {
          echo "version=$MISE_VERSION"
          echo "sha256=$(shasum -a 256 "$bin/mise" | cut -d' ' -f1)"
        } >> "$GITHUB_OUTPUT"
    # Save last, after tasks have installed any additional tools.
    - name: Install mise
      uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      with:
        version: ${{ steps.mise.outputs.version }}
        sha256: ${{ steps.mise.outputs.sha256 }}
        cache: ${{ steps.runner.outputs.fresh }}
        cache_save_post: ${{ steps.runner.outputs.fresh }}
        cache_key_prefix: mise-${{ github.job }}
        # A plan job needs only hk and Python, not Bazelisk.
        install_args: ${{ inputs.bazel == 'false' && 'hk python' || '' }}
        reshim: true
    - name: Record runner tool versions
      if: inputs.bazel == 'true'
      shell: bash
      run: |
        bazelisk --version
        python3 --version
        clang --version
        if [[ "$RUNNER_OS" == macOS ]]; then
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
        fi
    - name: Find missing Android SDK components
      if: inputs.android-cache == 'true' && steps.runner.outputs.fresh == 'true'
      id: sdk-cache
      shell: bash
      run: |
        paths="$(python3 tools/android/sdk.py --cache-paths)"
        if [[ -n "$paths" ]]; then
          {
            printf 'paths<<SDK_PATHS\n%s\nSDK_PATHS\n' "$paths"
            echo "key=$(printf '%s' "$paths" | sha256sum | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
        fi
    - name: Restore missing Android SDK components
      if: steps.sdk-cache.outputs.paths != ''
      uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
      with:
        path: ${{ steps.sdk-cache.outputs.paths }}
        key: android-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk-cache.outputs.key }}
    # Keep normal progress output without collecting per-invocation trace profiles.
    - name: Configure Bazel output
      if: inputs.bazel == 'true' && steps.runner.outputs.fresh == 'true'
      shell: bash
      run: |
        {
          echo 'common --generate_json_trace_profile=false'
          echo 'common --show_progress_rate_limit=5'
        } >> "$HOME/.bazelrc"
    # Extracted repositories live under the repository cache and leave it
    # once no build used them for 14 days; a zero idle delay lets Bazel prune
    # them between the job's commands.
    # A persistent runner's machine names its repository cache.
    - name: Locate cache
      if: inputs.bazel == 'true'
      id: cache
      shell: bash
      run: |
        cache=${BAZEL_REPOSITORY_CACHE:-$HOME/.cache/bazel-repository}
        echo "path=$cache" >> "$GITHUB_OUTPUT"
        echo "bazelrc=common --repository_cache=$cache --repo_contents_cache_gc_idle_delay=0" >> "$GITHUB_OUTPUT"
        echo "downloads-key=bazel-downloads-v1-$RUNNER_OS-$RUNNER_ARCH-$GITHUB_JOB-" >> "$GITHUB_OUTPUT"
    # Hosted macOS runners have no sticky disk: the cache service keeps a job's
    # downloads, such as the export templates, without the extracted
    # repositories. A key ends in the digest of the entry's file list; the
    # newest entry is restored, and save-downloads saves at the job's end.
    - name: Restore downloads
      if: inputs.bazel == 'true' && steps.runner.outputs.persistent-disk == 'false'
      id: downloads
      uses: actions/cache/restore@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
      with:
        path: ${{ steps.cache.outputs.path }}/content_addressable
        key: ${{ steps.cache.outputs.downloads-key }}
        restore-keys: ${{ steps.cache.outputs.downloads-key }}
    - name: Record restored downloads
      if: inputs.bazel == 'true' && steps.runner.outputs.persistent-disk == 'false'
      shell: bash
      env:
        DOWNLOADS: ${{ steps.cache.outputs.path }}/content_addressable
        KEY_PREFIX: ${{ steps.cache.outputs.downloads-key }}
        RESTORED_KEY: ${{ steps.downloads.outputs.cache-matched-key }}
      run: |
        {
          echo "BAZEL_DOWNLOADS=$DOWNLOADS"
          echo "BAZEL_DOWNLOADS_KEY_PREFIX=$KEY_PREFIX"
          echo "BAZEL_DOWNLOADS_RESTORED_KEY=$RESTORED_KEY"
        } >> "$GITHUB_ENV"
    # One disk per job: jobs fetch different repositories, and each job
    # commits its own clone of the disk.
    - name: Mount cache from sticky disk
      if: >-
        inputs.bazel == 'true' && runner.os == 'Linux'
        && steps.runner.outputs.fresh == 'true'
      uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
      with:
        key: ${{ github.repository }}-bazel-repository-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}
        path: ${{ steps.cache.outputs.path }}
    # Bazel refreshes a download's modification time on every cache hit.
    - name: Prune unused downloads
      if: inputs.bazel == 'true' && steps.runner.outputs.persistent-disk == 'true'
      shell: bash
      env:
        DOWNLOADS: ${{ steps.cache.outputs.path }}/content_addressable
      run: |
        if [[ -d "$DOWNLOADS" ]]; then
          find "$DOWNLOADS" -type f -mtime +30 -delete
          find "$DOWNLOADS" -mindepth 1 -type d -empty -delete
        fi
    - name: Configure repository cache
      if: inputs.bazel == 'true' && steps.runner.outputs.fresh == 'true'
      shell: bash
      env:
        REPOSITORY_BAZELRC: ${{ steps.cache.outputs.bazelrc }}
      run: printf '%s\n' "$REPOSITORY_BAZELRC" >> "$HOME/.bazelrc"
    # Persistent workers run from extracted repositories on the disk. Steps
    # clean up in reverse order, so Bazel stops before the disk is unmounted.
    - name: Stop Bazel at job end
      if: >-
        inputs.bazel == 'true' && runner.os == 'Linux'
        && steps.runner.outputs.fresh == 'true'
      uses: ./.github/actions/setup/stop-bazel
      with:
        bazel-modules: ${{ inputs.bazel-modules }}
        repository-cache: ${{ steps.cache.outputs.path }}
