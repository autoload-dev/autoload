name: Stop Bazel at job end
description: >-
  Shut down every Bazel server under the job's output user root, and with it its
  persistent workers, when the job ends, before earlier steps clean up. Each server
  has a bounded best-effort shutdown, then SIGTERM and SIGKILL. Only for fresh Linux
  runners: the step leaves a persistent runner's warm servers running.

inputs:
  shutdown-timeout-seconds:
    description: Maximum seconds per server's bazel shutdown before killing the cleanup client and stopping the server.
    default: "30"

  repository-cache:
    description: Dedicated Linux cache mount whose remaining holders must exit before unmount.
    default: ""

runs:
  using: node24
  main: main.js
  post: post.js
