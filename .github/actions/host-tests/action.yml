name: Run host tests
description: >-
  Set up the repository and run the host lane's planned tasks on this
  runner's host. Run it after the checkout.

inputs:
  tasks:
    description: JSON array of the host lane's planned mise tasks.
    required: true
  android:
    description: Whether a planned task needs the Android SDK, as the plan says for its job.
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up repository
      uses: ./.github/actions/setup
      with:
        # The ruleset's host set includes its Android packaging tests; add-on modules'
        # host lanes need no Android SDK.
        android-cache: ${{ inputs.android }}
    # The regression module's host set runs first, so that the output base check sees
    # only its repositories: later host tasks may configure Android targets.
    - name: Run the regression module's host set
      if: contains(inputs.tasks, '"test:regressions"')
      shell: bash
      run: python3 -m tools.ci.verification run '["test:regressions"]'
    - name: Require a regression host set without Android tools
      if: contains(inputs.tasks, '"test:regressions"')
      shell: bash
      working-directory: rules_godot/tests
      run: |
        external="$(bazel info output_base)/external"
        # rules_jvm_external++maven+ prefixes the hub and artifact repositories of both
        # Maven installs, maven and rules_android_maven.
        if ls "$external" | grep -E 'rules_jvm_external\+\+maven\+|android_toolchains'; then
          echo "The regression module's host set fetched Android tools or Maven artifacts" >&2
          exit 1
        fi
    - name: Run tests
      shell: bash
      env:
        TASKS: ${{ inputs.tasks }}
      run: python3 -m tools.ci.verification run "$(jq -c 'map(select(. != "test:regressions"))' <<< "$TASKS")"
    - name: Save Bazel downloads
      if: ${{ !cancelled() }}
      uses: ./.github/actions/setup/save-downloads
