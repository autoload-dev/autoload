; The layering of the build tools, which the file lint checks with import-linter
; (tools/lint/imports.py at the repository's root).

[importlinter]
root_package = tools

; The graph's scanner and reference detection build on the text of resources, queries on the
; graph, and pack selection on its queries' explanation chains. Other tools import the graph
; without what builds on it.
[importlinter:contract:resource_graph]
name = The graph's command line, pack selection, queries, the graph and the text of resources are layers
type = layers
layers =
    tools.resource_graph_command | tools.pack_selection
    tools.resource_graph_query
    tools.resource_graph
    tools.resource_text

; The command line of //tools/project:config builds on the composition of settings, which
; builds on the statements that the graph and several tools read alone.
[importlinter:contract:project_config]
name = The command line of project_config is above its library
type = layers
layers =
    tools.project.config_command
    tools.project.config
    tools.project.statements

; A py_binary's libraries are inputs of every action it runs, so the tools that stage,
; validate, index and pack files read only the text of resources, never the graph, and no
; command line.
[importlinter:contract:build_tools]
name = Build tools import neither the graph nor the command lines
type = forbidden
source_modules =
    tools.class_fragment
    tools.common_content
    tools.digest
    tools.godot_actions
    tools.godot_editor
    tools.godot_export
    tools.godot_files
    tools.godot_metadata_sync
    tools.godot_run
    tools.godot_staging
    tools.godot_sync
    tools.godot_validation
    tools.mapped_paths
    tools.metadata_index
    tools.node_ids
    tools.pack_contents
    tools.pack_writer
    tools.pck
    tools.resource_uids
    tools.runtime_profile
    tools.template
    tools.unit_interface
forbidden_modules =
    tools.pack_selection
    tools.project.config_command
    tools.resource_graph
    tools.resource_graph_command
    tools.resource_graph_query
